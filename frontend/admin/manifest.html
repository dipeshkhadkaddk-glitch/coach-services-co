<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Passenger Manifest — Brisbane 2032</title>
  <style>
    :root {
      --primary: #1e3a8a;
      --secondary: #64748b;
      --accent: #f59e0b;
      --border: #e2e8f0;
    }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      margin: 0;
      padding: 40px;
      color: #1e293b;
      background-color: #fff;
    }
    .manifest-container {
      max-width: 800px;
      margin: auto;
    }
    .header {
      border-bottom: 3px solid var(--primary);
      padding-bottom: 20px;
      margin-bottom: 30px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }
    .header-left h1 {
      margin: 0;
      color: var(--primary);
      font-size: 28px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .header-left p {
      margin: 5px 0 0;
      color: var(--secondary);
      font-weight: 500;
    }
    .header-right {
      text-align: right;
    }
    .booking-id {
      background: var(--primary);
      color: white;
      padding: 8px 15px;
      border-radius: 5px;
      font-weight: bold;
      font-size: 18px;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 30px;
    }
    .info-box {
      border: 1px solid var(--border);
      padding: 15px;
      border-radius: 8px;
    }
    .info-label {
      font-size: 12px;
      text-transform: uppercase;
      color: var(--secondary);
      margin-bottom: 5px;
      font-weight: 700;
    }
    .info-value {
      font-size: 16px;
      font-weight: 600;
    }

    .route-banner {
      background: #f8fafc;
      border-left: 5px solid var(--accent);
      padding: 15px;
      margin-bottom: 30px;
      font-size: 18px;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 40px;
    }
    th {
      text-align: left;
      background: #f1f5f9;
      padding: 12px 15px;
      border-bottom: 2px solid var(--border);
      font-size: 13px;
      text-transform: uppercase;
    }
    td {
      padding: 12px 15px;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
    }
    .role-badge {
      font-size: 11px;
      background: #e2e8f0;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 600;
    }

    .footer {
      margin-top: 50px;
      padding-top: 20px;
      border-top: 1px dashed var(--border);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
    }
    .signature-line {
      margin-top: 40px;
      border-top: 1px solid #000;
      padding-top: 5px;
      font-size: 12px;
      text-align: center;
    }

    .print-btn {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 30px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    @media print {
      .print-btn { display: none; }
      body { padding: 0; }
    }
  </style>
</head>
<body>
  <button class="print-btn" onclick="window.print()">🖨️ Print Manifest</button>

  <div class="manifest-container">
    <div class="header">
      <div class="header-left">
        <h1>Brisbane 2032</h1>
        <p>Coach Services Official Passenger Manifest</p>
      </div>
      <div class="header-right">
        <div class="booking-id" id="display-id">#0000</div>
        <p id="display-date" style="font-size:12px; margin-top:5px; color:var(--secondary);"></p>
      </div>
    </div>

    <div class="info-grid">
      <div class="info-box">
        <div class="info-label">Vehicle & Driver</div>
        <div class="info-value" id="display-vehicle">Loading...</div>
        <div style="font-size:13px; color:var(--secondary);" id="display-driver"></div>
      </div>
      <div class="info-box">
        <div class="info-label">License Plate</div>
        <div class="info-value" id="display-plate">—</div>
      </div>
    </div>

    <div class="route-banner">
      <span style="font-size:24px;">📍</span>
      <div id="display-route">Loading Route Details...</div>
    </div>

    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Passenger Name</th>
          <th>Phone Number</th>
          <th>Email Address</th>
          <th>Type</th>
        </tr>
      </thead>
      <tbody id="passenger-table">
        <!-- Loaded via JS -->
      </tbody>
    </table>

    <div class="footer">
      <div>
        <div class="signature-line">Driver Signature / Date</div>
      </div>
      <div>
        <div class="signature-line">Terminal Agent Signature / Date</div>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const bookingId = urlParams.get('id');

    if (!bookingId) {
      alert('No Booking ID provided.');
      window.close();
    }

    async function loadManifest() {
      const res = await api.get(`/bookings/${bookingId}/manifest`);
      if (!res.ok) {
        alert('Failed to load manifest: ' + res.data.message);
        return;
      }

      const m = res.data.data;
      document.getElementById('display-id').textContent = '#' + m.booking_id;
      document.getElementById('display-date').textContent = new Date().toLocaleDateString('en-AU', { dateStyle: 'long' });
      document.getElementById('display-vehicle').textContent = m.vehicle.name || 'Assigned Coach';
      document.getElementById('display-driver').textContent = 'Driver: ' + (m.vehicle.driver || 'N/A');
      document.getElementById('display-plate').textContent = m.vehicle.plate || 'N/A';
      document.getElementById('display-route').innerHTML = `<strong>${m.route.from}</strong> → <strong>${m.route.to}</strong>`;

      const tbody = document.getElementById('passenger-table');
      tbody.innerHTML = m.passengers.map((p, i) => `
        <tr>
          <td>${i + 1}</td>
          <td style="font-weight:600;">${p.name}</td>
          <td>${p.phone || '—'}</td>
          <td style="font-size:13px;">${p.email || '—'}</td>
          <td><span class="role-badge">${p.role}</span></td>
        </tr>
      `).join('');
    }

    loadManifest();
  </script>
</body>
</html>
