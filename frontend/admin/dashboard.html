<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Dashboard — Coach Services Co.</title>
  <link rel="stylesheet" href="/css/style.css"/>
</head>
<body>
<div id="sidebar-overlay" class="sidebar-overlay"></div>
<div class="app-layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="brand-icon">🚌</div>
      <div class="brand-text"><h2>Coach Services</h2><span>Admin Portal</span></div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-section-label">Overview</div>
      <a href="/admin/dashboard.html" class="nav-item active"><span class="nav-icon">📊</span> Dashboard</a>
      <a href="/admin/bookings.html" class="nav-item"><span class="nav-icon">🎫</span> Bookings</a>
    </div>
    <div class="sidebar-section" style="margin-top:12px;">
      <div class="sidebar-section-label">Management</div>
      <a href="/admin/users.html" class="nav-item"><span class="nav-icon">👥</span> Users</a>
      <a href="/admin/vehicles.html" class="nav-item"><span class="nav-icon">🚌</span> Vehicles</a>
      <a href="/admin/routes.html" class="nav-item"><span class="nav-icon">🗺️</span> Routes</a>
      <a href="/admin/events.html" class="nav-item"><span class="nav-icon">🏅</span> Events</a>
    </div>
    <div class="sidebar-footer">
      <button class="btn-logout" onclick="logout()">⏻ Logout</button>
    </div>
  </aside>

  <div class="main-content">
    <header class="topbar">
      <div class="page-title">Admin Dashboard</div>
    </header>

    <main class="page-content">
      <div class="olympics-banner">
        <span class="banner-icon">🏟️</span>
        <div><h3>Brisbane Olympics 2032</h3><p>Transport Operations Command Centre</p></div>
      </div>

      <!-- Quick Actions -->
      <div class="card mt-4">
        <div class="card-header"><h3 class="card-title">Quick Actions</h3></div>
        <div class="card-body">
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;">
            <a href="/admin/events.html?action=add" class="btn btn-primary" style="flex-direction:column;padding:20px;gap:8px;">
               <span style="font-size:28px;">➕</span><span>Add Event</span>
            </a>
            <a href="/admin/users.html" class="btn btn-secondary" style="flex-direction:column;padding:20px;gap:8px;"><span style="font-size:28px;">👥</span><span>Users</span></a>
            <a href="/admin/vehicles.html" class="btn btn-secondary" style="flex-direction:column;padding:20px;gap:8px;"><span style="font-size:28px;">🚌</span><span>Vehicles</span></a>
            <a href="/admin/bookings.html" class="btn btn-secondary" style="flex-direction:column;padding:20px;gap:8px;"><span style="font-size:28px;">🎫</span><span>Bookings</span></a>
          </div>
        </div>
      </div>

      <div class="page-header mt-4"><h2>System Stats</h2></div>
      <div class="stats-grid" id="stats-grid">
         <div class="stat-card blue"><div class="stat-value" id="s-bookings">—</div><div class="stat-label">Total Bookings</div></div>
         <div class="stat-card teal"><div class="stat-value" id="s-events">—</div><div class="stat-label">Olympic Events</div></div>
      </div>
    </main>
  </div>
</div>

<script src="/js/api.js"></script><script src="/js/app.js"></script>
<script>
const currentUser = requireAuth('admin');
if (currentUser) { populateSidebar(currentUser); initSidebar(); loadStats(); loadNotifications(); }

async function loadStats() {
  const res = await api.getDashboardStats();
  if (res.ok) {
    const d = res.data.data;
    document.getElementById('s-bookings').textContent = d.total_bookings;
    document.getElementById('s-events').textContent = d.total_events;
  }
}
</script>
</body>
</html>
