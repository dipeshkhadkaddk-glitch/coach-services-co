<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Olympic Events — Coach Services Co.</title>
  <link rel="stylesheet" href="/css/style.css"/>
</head>
<body>
<div class="app-layout">
  <!-- SIDEBAR -->
  <div class="main-content">
    <header class="topbar"><div class="page-title">Event Schedule</div></header>
    <main class="page-content">
      <div id="events-container" class="vehicle-grid"></div>
    </main>
  </div>
</div>

<!-- Event Details Modal -->
<div class="modal-overlay" id="detail-modal">
  <div class="modal" style="max-width:500px;">
    <div class="modal-header"><h3 id="d-title">Event Details</h3><button onclick="closeModal('detail-modal')">×</button></div>
    <div class="modal-body" id="detail-body"></div>
    <div class="modal-footer"><a href="/user/book.html" class="btn btn-primary">🎫 Book Ride</a></div>
  </div>
</div>

<script src="/js/api.js"></script><script src="/js/app.js"></script>
<script>
const currentUser = requireAuth('user');
let allEvents = [];
if (currentUser) { loadEvents(); }

async function loadEvents() {
  const res = await api.getEvents();
  allEvents = res.data.data || [];
  document.getElementById('events-container').innerHTML = allEvents.map(ev => `
    <div class="event-card" onclick="viewDetails(${ev.id})" style="cursor:pointer">
      <div class="event-titles"><h3>${ev.name}</h3><span>${ev.venue_name || 'TBA'}</span></div>
      <button class="btn btn-outline btn-sm btn-full mt-2">View Details</button>
    </div>
  `).join('');
}

function viewDetails(id) {
  const ev = allEvents.find(e => e.id === id);
  document.getElementById('d-title').textContent = ev.name;
  document.getElementById('detail-body').innerHTML = `
    <div class="detail-section">
      <label>📍 Venue</label><h3>${ev.venue_name}</h3>
      <p>${ev.venue_address || 'Address pending update'}</p>
    </div>
    <div class="detail-section mt-3">
      <label>📅 Time</label>
      <p>${ev.start_time} - ${ev.end_time}</p>
    </div>
  `;
  openModal('detail-modal');
}
</script>
</body>
</html>
