<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Coach Services Co. — Brisbane Olympics 2032</title>
  <meta name="description" content="Official coach transport service for the Brisbane 2032 Olympics. Book your ride with fixed pricing."/>
  <link rel="stylesheet" href="/css/style.css"/>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚌</text></svg>"/>
</head>
<body>
<div class="auth-page">
  <div class="auth-container">
    <div class="auth-logo">
      <div class="logo-icon">🚌</div>
      <h1>Coach Services Co.</h1>
      <p>Brisbane Olympics 2032 — Official Transport Partner</p>
    </div>

    <div class="auth-card">
      <div class="auth-tabs">
        <button class="auth-tab active" id="tab-login" onclick="switchTab('login')">Sign In</button>
        <button class="auth-tab" id="tab-register" onclick="switchTab('register')">Request Access</button>
      </div>

      <!-- LOGIN TAB -->
      <div class="tab-content active" id="content-login">
        <div id="login-alert" class="alert"></div>
        <form id="login-form" onsubmit="handleLogin(event)">
          <div class="form-group">
            <label class="form-label" for="login-email">Email Address</label>
            <input type="email" id="login-email" class="form-control" placeholder="you@example.com" required autocomplete="email"/>
          </div>
          <div class="form-group">
            <label class="form-label" for="login-password">Password</label>
            <input type="password" id="login-password" class="form-control" placeholder="Enter your password" required autocomplete="current-password"/>
          </div>
          <button type="submit" class="btn btn-primary btn-full btn-lg" id="login-btn">
            <span>🔑</span> Sign In
          </button>
        </form>
        <div class="text-center mt-3" style="font-size:13px; color:var(--text-muted);">
          Don't have an account? <a href="#" onclick="switchTab('register')">Request Access</a>
        </div>
      </div>

      <!-- REGISTER TAB -->
      <div class="tab-content" id="content-register">
        <div id="register-alert" class="alert"></div>
        <form id="register-form" onsubmit="handleRegister(event)">
          <div class="form-group">
            <label class="form-label" for="reg-name">Full Name *</label>
            <input type="text" id="reg-name" class="form-control" placeholder="John Smith" required/>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="reg-dob">Date of Birth</label>
              <input type="date" id="reg-dob" class="form-control"/>
            </div>
            <div class="form-group">
              <label class="form-label" for="reg-phone">Phone Number *</label>
              <input type="tel" id="reg-phone" class="form-control" placeholder="+61 400 000 000" required/>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="reg-address">Address</label>
            <input type="text" id="reg-address" class="form-control" placeholder="123 Main St, Brisbane QLD"/>
          </div>
          <div class="form-group">
            <label class="form-label" for="reg-email">Email Address *</label>
            <input type="email" id="reg-email" class="form-control" placeholder="you@example.com" required/>
          </div>
          <div class="form-group">
            <label class="form-label" for="reg-password">Password *</label>
            <input type="password" id="reg-password" class="form-control" placeholder="Min. 6 characters" minlength="6" required/>
          </div>
          <button type="submit" class="btn btn-primary btn-full btn-lg" id="register-btn">
            <span>📋</span> Submit Profile Request
          </button>
        </form>
        <div class="text-center mt-3" style="font-size:13px; color:var(--text-muted);">
          Already have an account? <a href="#" onclick="switchTab('login')">Sign In</a>
        </div>
        <div class="alert alert-info show mt-3" style="font-size:12px;">
          ℹ️ Your request will be reviewed by an admin before you can log in.
        </div>
      </div>
    </div>

    <div class="text-center mt-3" style="font-size:12px; color:var(--text-muted);">
      🏅 Brisbane 2032 Olympics — Official Coach Services
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
<script>
// Redirect if already logged in
const existingToken = localStorage.getItem('csc_token');
const existingUser = JSON.parse(localStorage.getItem('csc_user') || 'null');
if (existingToken && existingUser) {
  window.location.href = existingUser.role === 'admin' ? '/admin/dashboard.html' : '/user/dashboard.html';
}

function switchTab(tab) {
  document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  document.getElementById('content-' + tab).classList.add('active');
}

function showAlert(id, msg, type = 'danger') {
  const el = document.getElementById(id);
  el.className = `alert alert-${type} show`;
  el.innerHTML = (type === 'danger' ? '❌ ' : '✅ ') + msg;
}

async function handleLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('login-btn');
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;

  btn.disabled = true;
  btn.innerHTML = '<div class="spinner" style="width:18px;height:18px;border-width:2px;"></div> Signing in...';

  const res = await api.login(email, password);
  btn.disabled = false;
  btn.innerHTML = '<span>🔑</span> Sign In';

  if (!res.ok) {
    showAlert('login-alert', res.data.message || 'Login failed', 'danger');
    return;
  }

  localStorage.setItem('csc_token', res.data.token);
  localStorage.setItem('csc_user', JSON.stringify(res.data.user));
  const user = res.data.user;
  window.location.href = user.role === 'admin' ? '/admin/dashboard.html' : '/user/dashboard.html';
}

async function handleRegister(e) {
  e.preventDefault();
  const btn = document.getElementById('register-btn');
  const data = {
    full_name: document.getElementById('reg-name').value.trim(),
    dob: document.getElementById('reg-dob').value,
    phone: document.getElementById('reg-phone').value.trim(),
    address: document.getElementById('reg-address').value.trim(),
    email: document.getElementById('reg-email').value.trim(),
    password: document.getElementById('reg-password').value,
  };

  if (!data.full_name || !data.phone || !data.email || !data.password) {
    showAlert('register-alert', 'Please fill all required fields', 'danger');
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<div class="spinner" style="width:18px;height:18px;border-width:2px;"></div> Submitting...';

  const res = await api.register(data);
  btn.disabled = false;
  btn.innerHTML = '<span>📋</span> Submit Profile Request';

  if (!res.ok) {
    showAlert('register-alert', res.data.message || 'Registration failed', 'danger');
    return;
  }
  showAlert('register-alert', res.data.message || 'Request submitted! Await admin approval.', 'success');
  document.getElementById('register-form').reset();
}
</script>
</body>
</html>
